<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تغيير كلمة المرور</title>
</head>
<body>
  <p><a href="{{ url_for('dashboard') }}">← رجوع</a></p>
  <h2>تغيير كلمة المرور</h2>

  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="password" name="current_password" placeholder="كلمة المرور الحالية" required><br>
    <input type="password" name="new_password" placeholder="كلمة المرور الجديدة (8 رموز على الأقل)" required><br>
    <input type="password" name="confirm_password" placeholder="تأكيد كلمة المرور الجديدة" required><br>
    <button type="submit">حفظ</button>
  </form>
</body>
</html>
