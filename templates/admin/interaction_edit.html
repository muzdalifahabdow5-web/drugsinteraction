<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تعديل تداخل</title>
</head>
<body>
  <p><a href="{{ url_for('admin_interactions') }}">← التداخلات</a></p>
  <h2>تعديل التداخل رقم {{ inter.interaction_id }}</h2>

  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}
  {% endwith %}

  <form method="POST">
    <select name="drug_1_id" required>
      {% for m in meds %}<option value="{{ m.id }}" {% if m.id == inter.drug_1_id %}selected{% endif %}>{{ m.scientific_name }} ({{ m.trade_name }})</option>{% endfor %}
    </select><br>
    <select name="drug_2_id" required>
      {% for m in meds %}<option value="{{ m.id }}" {% if m.id == inter.drug_2_id %}selected{% endif %}>{{ m.scientific_name }} ({{ m.trade_name }})</option>{% endfor %}
    </select><br>
    <select name="severity" required>
      {% for key, label in severity_ar.items() %}<option value="{{ key }}" {% if key == inter.severity %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select><br>
    <textarea name="description" required>{{ inter.description }}</textarea><br>
    <button type="submit">حفظ التعديل</button>
  </form>
</body>
</html>
