<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تعديل دواء</title>
</head>
<body>
  <p><a href="{{ url_for('admin_medications') }}">← الأدوية</a></p>
  <h2>تعديل الدواء: {{ med.scientific_name }}</h2>

  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="text" name="scientific_name" value="{{ med.scientific_name }}" placeholder="الاسم العلمي" required><br>
    <input type="text" name="trade_name" value="{{ med.trade_name }}" placeholder="الاسم التجاري" required><br>
    <input type="text" name="dosage_form" value="{{ med.dosage_form or '' }}" placeholder="الشكل الصيدلاني"><br>
    <input type="text" name="concentration" value="{{ med.concentration or '' }}" placeholder="التركيز"><br>
    <textarea name="warning" placeholder="التحذير">{{ med.warning or '' }}</textarea><br>
    <select name="classification_id">
      <option value="">— بدون تصنيف —</option>
      {% for c in classifications %}
        <option value="{{ c.id }}" {% if c.id == med.classification_id %}selected{% endif %}>{{ c.name_arabic }}</option>
      {% endfor %}
    </select><br>
    <button type="submit">حفظ التعديل</button>
  </form>
</body>
</html>
